<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="common.js"></script>
    <title>ScriptCat</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        border: 0;
        min-height: 150px;
        max-height: 600px;
      }
      /* 桌面 popup 的窗口宽度由内容的内在宽度反推，宽度规则不能依赖视口：
         曾用 @media (min-width) 在宽视口切到 width:100%，出现经典(非覆盖式)滚动条时
         视口会变成 360px + 滚动条宽而命中，Chrome 150 及以下据此算出的内在宽度趋近 0，
         popup 卡在 25px 细条(#1800)。
         固定 width 让内在宽度恒为 360px；min-width 的百分比不参与内在宽度，
         只在移动端(如 Edge Android)视口被强制撑满设备宽度时生效，消除右侧留白(#686)。 */
      html {
        width: 360px;
        min-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
