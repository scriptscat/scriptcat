minimumReleaseAge: 10080

overrides:
  # Only versions outside the parent's declared range belong here. A patched release
  # the parent's range already allows is picked up by refreshing pnpm-lock.yaml.

  # @rspack/dev-server@1.1.5 pins webpack-dev-server@5.2.2 exactly.
  "@rspack/dev-server@1.1.5>webpack-dev-server": "5.2.6"

  # see https://github.com/sockjs/sockjs-node/pull/317 (drops the vulnerable uuid@8)
  # Fetch the codeload tarball over HTTPS rather than the `github:` shorthand:
  # pnpm resolves the shorthand to a git+ssh URL that fails on CI runners lacking
  # an SSH key. The commit has no build step, so the tarball is usable as-is.
  "webpack-dev-server@5.2.6>sockjs@0.3.24": "https://codeload.github.com/sockjs/sockjs-node/tar.gz/c239289d8cd85647aff064337d81073f0e4e080a"

  # concurrently@10.0.5 pins shell-quote@1.9.0 exactly; no concurrently release
  # carries a patched one yet. 1.11.0 is a same-major minor bump, and concurrently
  # only calls quote() on plain argv strings.
  "concurrently@10.0.5>shell-quote": "1.11.0"

patchedDependencies:
  happy-dom: patches/happy-dom.patch
  uri-js@4.4.1: patches/uri-js@4.4.1.patch
