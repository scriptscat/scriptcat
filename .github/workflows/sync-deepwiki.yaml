name: sync DeepWiki

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deepwiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync DeepWiki context
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Sync DeepWiki MCP snapshot
        shell: bash
        run: |
          set -euo pipefail

          node ./scripts/sync-deepwiki.mjs \
            --repository scriptscat/scriptcat \
            --output .deepwiki

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          set -euo pipefail

          git add -A -- .deepwiki
          if git diff --cached --quiet; then
            echo "DeepWiki snapshot is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "📄 refresh DeepWiki snapshot"
          git push origin HEAD:main
